apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
spec:
  selector:
    matchLabels:
      app: db
  replicas: 1
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: my-redis 
          image: redis:latest 
          ports:
          - containerPort: 6379
          args: ["redis-server", "--appendonly", "yes"] # to save Redis data to files
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: db-pvc
            