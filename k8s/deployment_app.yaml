apiVersion: apps/v1
kind: Deployment 
metadata:
  name: app-deployment
spec:
  selector:
    matchLabels:
      app: tasks
  replicas: 3
  template:
    metadata:
      labels:
        app: tasks
    spec:
      containers:
        - name: tasks-app
          image: mghzakariae/k8s_proj:v1.0.2
          ports:
          - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          env:
          - name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: app-secret
                key: secret-key
